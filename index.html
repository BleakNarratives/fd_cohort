
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>FanDuel Cohort | Dopamine Factory Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
          background: #000; 
          overflow: hidden; 
          font-family: 'Inter', sans-serif; 
          -webkit-tap-highlight-color: transparent;
        }

        /* Scanline Overlay for BTTF II Vibes */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.3;
        }

        .foxy-bulge {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .foxy-bulge:hover, .foxy-bulge:active {
            transform: scale(1.08) translateY(-4px);
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.6));
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
            z-index: 50;
        }

        /* Neon Glow Utility */
        .neon-border {
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4), inset 0 0 5px rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        /* Fireworks / Particles */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: particleFly 1.2s cubic-bezier(0.1, 0.9, 0.3, 1) forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw-tx), var(--tw-ty)) scale(0); opacity: 0; }
        }

        /* Hiss/Steam Animation */
        @keyframes steamFade {
            0% { opacity: 0; transform: translateY(60px) scale(0.7); filter: blur(20px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .steam-ingress { animation: steamFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        ::-webkit-scrollbar { width: 0px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Interactive Polish */
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^2.12.7",
    "lucide-react": "https://esm.sh/lucide-react@^0.475.0"
  }
}
</script>
</head>
<body class="text-slate-100">
    <div id="root"></div>
</body>
</html>
