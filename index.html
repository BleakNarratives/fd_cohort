
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>FanDuel Cohort | Dopamine Factory v4.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
          background: #000; 
          overflow: hidden; 
          font-family: 'Inter', sans-serif; 
          -webkit-tap-highlight-color: transparent;
        }

        /* BTTF II PHOSPHOR GLOW */
        #root {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, #050b1a 0%, #000 100%);
        }

        /* THE "DOPAMINE" SCANLINES */
        #root::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            z-index: 10000;
            pointer-events: none;
            opacity: 0.4;
        }

        /* NEON FLICKER */
        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 22%, 24%, 55% { opacity: 0.8; }
        }
        .neon-text {
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4);
            animation: neonFlicker 3s infinite;
        }

        .gold-glow {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8), 0 0 30px rgba(212, 175, 55, 0.4);
        }

        /* INTERACTIVE CARD TILT */
        .casino-card {
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.4, 1), box-shadow 0.2s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        .casino-card:active {
            transform: scale(0.98) rotateX(2deg);
        }

        /* PARTICLE ENGINE */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
            animation: particleFly 1s cubic-bezier(0.1, 0.9, 0.3, 1) forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw-tx), var(--tw-ty)) scale(0); opacity: 0; }
        }

        ::-webkit-scrollbar { width: 0px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        * { -webkit-font-smoothing: antialiased; }
    </style>
<script type="importmap">

</head>

    <div id="root"></div>
</body>
</html>
